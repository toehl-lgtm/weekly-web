<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="50%" stop-color="#0066EE"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(240,244,255,0.85)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#002266" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner glow overlay -->
  <rect width="512" height="512" rx="115" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- Calendar Base Card -->
  <g filter="url(#shadow)">
    <rect x="76" y="96" width="360" height="320" rx="36" fill="url(#cardGrad)"/>
    
    <!-- Top Accent Bar -->
    <path d="M 76 132 C 76 112 92 96 112 96 L 400 96 C 420 96 436 112 436 132 L 436 156 L 76 156 Z" fill="#0A84FF"/>
    
    <!-- Header Rings / Dots -->
    <circle cx="160" cy="126" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="256" cy="126" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="352" cy="126" r="8" fill="#FFFFFF" opacity="0.9"/>

    <!-- Weekly Grid Columns Preview inside Icon -->
    <!-- Column 1 (Mon) -->
    <rect x="108" y="184" width="64" height="70" rx="12" fill="#0A84FF" fill-opacity="0.15"/>
    <rect x="108" y="184" width="6" height="70" rx="3" fill="#0A84FF"/>
    <rect x="108" y="270" width="64" height="110" rx="12" fill="#30D158" fill-opacity="0.15"/>
    <rect x="108" y="270" width="6" height="110" rx="3" fill="#30D158"/>

    <!-- Column 2 (Tue) -->
    <rect x="188" y="210" width="64" height="100" rx="12" fill="#BF5AF2" fill-opacity="0.15"/>
    <rect x="188" y="210" width="6" height="100" rx="3" fill="#BF5AF2"/>
    <rect x="188" y="326" width="64" height="60" rx="12" fill="#FF9F0A" fill-opacity="0.15"/>
    <rect x="188" y="326" width="6" height="60" rx="3" fill="#FF9F0A"/>

    <!-- Column 3 (Wed) -->
    <rect x="268" y="184" width="64" height="130" rx="12" fill="#0A84FF" fill-opacity="0.2"/>
    <rect x="268" y="184" width="6" height="130" rx="3" fill="#0A84FF"/>
    
    <!-- Column 4 (Thu) -->
    <rect x="348" y="230" width="56" height="90" rx="12" fill="#30D158" fill-opacity="0.15"/>
    <rect x="348" y="230" width="6" height="90" rx="3" fill="#30D158"/>

    <!-- Active Time Indicator Line (Red Line) -->
    <line x1="96" y1="250" x2="416" y2="250" stroke="#FF375F" stroke-width="3" stroke-linecap="round"/>
    <circle cx="98" cy="250" r="5" fill="#FF375F"/>
  </g>
</svg>
